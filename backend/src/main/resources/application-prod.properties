server.port=7777

spring.data.mongodb.database=blog
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017

spring.session.store-type=redis
spring.redis.host=localhost
spring.redis.port=6379
server.servlet.session.timeout=30m

# ── 会话 cookie ──
# 这个文件走的是 https（下面配了 key-store），所以 secure 可以直接钉死。
# 注意：千万别用 http 起 prod profile 调本地 —— 钉了 secure 的 cookie
# 在明文 HTTP 上不会被回传，表现是"登录成功但下一个请求又是匿名的"。
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true

logging.level.org.springframework.security: DEBUG

# ── 评论区的 GitHub 登录 ──
# client-id / client-secret 从环境变量来，**不要写进这个文件** ——
# 它进 git。client_secret 等于 OAuth App 的密码。
#   export GITHUB_CLIENT_ID=Ov23li...
#   export GITHUB_CLIENT_SECRET=...
# 两个值任一为空时评论区的登录按钮不显示。
github.oauth.client-id=${GITHUB_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:}
# 必须和 OAuth App 后台登记的 callback URL 完全一致。
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI:https://inforetrieval.com.cn:7777/api/auth/github/callback}
github.oauth.scope=read:user

# ── 前端自己跑在哪儿 ──
# 前端由 nginx 服务在 443 上，后端在 7777，两者跨源。GitHub 回调发生在后端
# 的 origin 上，跳回前端时必须拼绝对地址，否则 /blog/xxx 会被解析成
# https://inforetrieval.com.cn:7777/blog/xxx，后端没这条路由，404。
frontend.origin=${FRONTEND_ORIGIN:https://inforetrieval.com.cn}

#ssl setting
server.ssl.key-store=classpath:inforetrieval.com.cn.pfx
server.ssl.key-store-password=o8e177y7
server.ssl.key-store-type=PKCS12
