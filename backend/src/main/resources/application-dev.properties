server.port=7777

spring.data.mongodb.database=blog
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017

spring.session.store-type=redis
spring.redis.host=localhost
spring.redis.port=6379

server.servlet.session.timeout=30m

# ── 会话 cookie ──
# csrf 是关着的（见 SecurityConfig），SameSite=Lax 是那条路上仅剩的跨站写保护：
# 别的站点发起的 POST 带不上这个 cookie。Lax 不影响 GitHub 回调 ——
# 那是顶层 GET 导航，Lax 明确允许。
# 这两个值会经由 SessionAutoConfiguration 落到 Spring Session 的
# DefaultCookieSerializer 上，不是只管容器自己的 cookie。
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true

# 日志级别不在这里配 —— 全部在 src/main/resources/log4j2-spring.xml（dev/prod 各一个分支）。
# 为什么删掉原来那行 logging.level.org.springframework.security：
# Spring Boot 会把 properties 里的 logging.level.* 应用到 Log4j2 上，**覆盖** XML 里的
# <Logger>。两边都写的话，改 XML 不生效、改这里才生效 —— 实测过，是个很坑的"改了没反应"。
# 所以只留一处。要调级别去改那个 XML，别在这里加回来。

# ── 评论区的 GitHub 登录 ──
# client-id / client-secret 在 GitHub → Settings → Developer settings → OAuth Apps 取。
# **secret 只能从环境变量来**：这个文件是进 git 的，而 client_secret
# 等于这个 OAuth App 的密码，泄露了任何人都能冒充它换 token。
#   export GITHUB_CLIENT_ID=Ov23li...
#   export GITHUB_CLIENT_SECRET=...
# 两个值任一为空时 /api/auth/me 会返回 githubEnabled=false，前端就不显示
# 登录按钮，不会有人点进去撞 GitHub 的报错页。
github.oauth.client-id=${GITHUB_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:}
# 必须和 OAuth App 后台登记的 Authorization callback URL **完全一致**
# （含端口和路径），差一个字符 GitHub 就报 redirect_uri_mismatch。
github.oauth.redirect-uri=${GITHUB_REDIRECT_URI:http://localhost:7777/api/auth/github/callback}
github.oauth.scope=read:user

# ── 前端自己跑在哪儿 ──
# GitHub 登录成功（或失败）后要跳回前端，而回调是在**后端**的 origin 上发生的。
# Location 只写路径的话会被浏览器解析到后端（:7777）上 —— /blog/xxx 是前端的
# 路由，后端没有，用户看到的是一个 404 白页。所以 origin 必须在这里配。
# 前端只被允许说"回到站内的哪个路径"，origin 由服务端定 ——
# 让请求方指定 origin 就是开放重定向。
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# docker-compose setting
spring.docker.compose.lifecycle-management=start_only